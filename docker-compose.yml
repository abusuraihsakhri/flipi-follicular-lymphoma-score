version: '3.8'

services:
  flipi-follicular-lymphoma-score:
    build: .
    container_name: flipi-follicular-lymphoma-score
    ports:
      - "8000:8000"
    environment:
      # IMPORTANT: Override this in production with a strong random secret
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-change-me-in-production}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
