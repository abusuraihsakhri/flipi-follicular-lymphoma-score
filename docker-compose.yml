services:
  flipi-follicular-lymphoma-score:
    build: .
    container_name: flipi-follicular-lymphoma-score
    ports:
      - "127.0.0.1:8000:8000"
    # A random process-local audit key is used if AUDIT_SECRET_KEY is unset.
    # Provide an external secret for stable HMAC verification across restarts.
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-}
      - MODEL_PROVIDER=mock
    command: ["uvicorn", "agents.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
