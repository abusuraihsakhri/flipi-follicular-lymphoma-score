name: Flipi Follicular Lymphoma Score CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic pytest

    - name: Verify Python dependencies and syntax
      run: |
        python -m pip check
        python -m compileall -q flipi_score.py cli.py agents tests enrichment.py simulator.py

    - name: Run Pytest Suite
      run: pytest -v

    - name: Set up Node.js for static browser tests
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate browser JavaScript
      run: |
        node --check web/flipi.js
        node --test web/flipi.test.cjs

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-and-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/web
          cp index.html _site/index.html
          cp web/index.html web/flipi.js _site/web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
